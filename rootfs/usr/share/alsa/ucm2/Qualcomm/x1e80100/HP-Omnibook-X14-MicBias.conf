# HP OmniBook X 14: its two microphones (VA DMIC0/1) are powered by the WCD938x's
# MIC BIAS1, as on the ThinkPad T14s, but its device tree (copied from the CRD) ties
# DMIC0/1 to MIC BIAS3 and only DMIC2/3 to MIC BIAS1 -- so they capture pure silence.
# The DTB is built into the Secure Boot-signed kernel, so instead also capture DMIC2
# (not connected) on a third decimator: DAPM then powers MIC BIAS1. The stream stays
# 2 channels (DMIC0/1).
# Included in the "Mic" device of T14s-HiFi.conf by build_files/30-gpu-audio.sh.
#
# The T14s' 100 (+16 dB) on DEC0/1 is quiet for these mics: 106 (+22 dB). Included
# after the DMIC0/1 enable sequences, so it overrides theirs.

EnableSequence [
	cset "name='VA DEC2 MUX' VA_DMIC"
	cset "name='VA DMIC MUX2' DMIC2"
	cset "name='VA_AIF1_CAP Mixer DEC2' 1"
	cset "name='VA_DEC0 Volume' 106"
	cset "name='VA_DEC1 Volume' 106"
]

DisableSequence [
	cset "name='VA DMIC MUX2' ZERO"
	cset "name='VA_AIF1_CAP Mixer DEC2' 0"
]
