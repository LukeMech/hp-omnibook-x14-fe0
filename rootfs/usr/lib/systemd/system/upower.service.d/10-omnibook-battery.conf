[Unit]
# UPower reads the battery's capacity only once, when it appears, and right after the
# ADSP starts that capacity is still a placeholder (~100%). So at boot UPower waits for
# omnibook-battery-settle.service (pulled in by omnibook-adsp.service), which finishes
# once the ADSP reports the real values. Ordering only: without the ADSP firmware
# (first boot) both omnibook services are skipped and UPower starts right away.
After=omnibook-battery-settle.service
