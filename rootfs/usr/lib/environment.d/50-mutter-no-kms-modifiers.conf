# Wrong colors (green/blue tint) on the internal panel once the GPU is accelerated,
# while screenshots look right: the display controller misreads the GPU's compressed
# (UBWC) buffers. Without KMS modifiers mutter scans out plain linear buffers.
# environment.d reaches GNOME Shell (a systemd user service) and the GDM greeter.
MUTTER_DEBUG_USE_KMS_MODIFIERS=0
